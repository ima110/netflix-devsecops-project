apiVersion: v1
kind: Service
metadata:
  name: netflix-service
  namespace: {{ .Values.namespace.name }}
  labels:
    app: netflix-app
spec:
  type: {{ .Values.service.type }}
  selector:
    app: netflix-app
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
