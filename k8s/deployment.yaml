apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-app
  namespace: netflix
  labels:
    app: netflix-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: netflix-app
  template:
    metadata:
      labels:
        app: netflix-app
    spec:
      containers:
        - name: netflix-app
          image: 780604191148.dkr.ecr.us-east-1.amazonaws.com/netflix-ecr:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
